[project]
name = 'Call_Me_Maybe'
version = '0.1.0'
requires-python = '>=3.10'
dependencies = ['numpy>=1.26', 'pydantic>=2,<3']

[dependency-groups]
dev = [
    'flake8==7.3.0',
    'mypy==2.4.1',
    'tomli>=2; python_version < "3.11"',
]

[tool.mypy]
mypy_path = 'llm_sdk'
exclude = ['^llm_sdk/', '^\.venv/']

# Only the unchanged vendor implementation is audited separately.
# Preserve its public annotations when checking application calls.
[[tool.mypy.overrides]]
module = ['llm_sdk', 'llm_sdk.*']
follow_imports = 'silent'
